services:
  app:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-37703}:3100"          # this machine only: the app posts to GitHub as you
    volumes:
      - ./data:/app/data                                # SQLite database and review sessions
      - ${REPOS_ROOT:-${HOME}/Documents}:/repos:ro      # local checkouts, for reviewing branches before a PR
    # Everything personal comes from .env (copy .env.example). A missing required value
    # stops `docker compose up` with the message below instead of starting a broken app.
    environment:
      - PORT=3100
      - NODE_ENV=production
      - REPOS=${REPOS:?REPOS is not set in .env - see .env.example}
      - LOCAL_REPOS=${LOCAL_REPOS:-}
      - LOCAL_REPOS_ROOT=/repos
      - HOST_REPOS_ROOT=${REPOS_ROOT:-${HOME}/Documents}   # to find worktrees, which git records by host path
      - GH_TOKEN=${GH_TOKEN:?GH_TOKEN is not set in .env - run gh auth token}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:?CLAUDE_CODE_OAUTH_TOKEN is not set in .env - run claude setup-token}
    restart: unless-stopped
